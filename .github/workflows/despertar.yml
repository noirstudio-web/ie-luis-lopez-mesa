# Mantiene despierto el sistema escolar en Render (plan gratis) y vigila que funcione.
# - Lo visita cada 5 minutos para que no "se duerma".
# - Si no responde o no puede guardar los datos, la tarea falla y GitHub envía un correo al dueño de la cuenta.
name: Mantener despierto el sistema

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Visitar y revisar el sistema
        run: |
          URL="https://ie-luis-lopez-mesa.onrender.com/api/public"
          for i in 1 2 3; do
            BODY=$(curl -sS -m 120 -w '\n%{http_code}' "$URL" || true)
            CODE=$(echo "$BODY" | tail -n1)
            ESTADO=$(echo "$BODY" | head -n -1 | grep -o '"storage":"[a-z]*"' | cut -d'"' -f4)
            echo "Intento $i: respuesta $CODE, guardado: ${ESTADO:-?}"
            if [ "$CODE" = "200" ] && [ "$ESTADO" != "error" ]; then exit 0; fi
            sleep 30
          done
          if [ "$CODE" = "200" ]; then
            echo "::error::El sistema funciona pero NO puede guardar los datos en GitHub (revisa el token en Render)"
          else
            echo "::error::El sistema no responde (revisa Render)"
          fi
          exit 1

      # GitHub pausa las tareas programadas si el repositorio pasa 60 días sin cambios:
      # si el último cambio tiene más de 6 días, se actualiza un archivo para que siga activo.
      - name: Revisar actividad del repositorio
        id: actividad
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ULTIMA=$(gh api "repos/${{ github.repository }}/commits?per_page=1" --jq '.[0].commit.committer.date')
          DIAS=$(( ( $(date -u +%s) - $(date -u -d "$ULTIMA" +%s) ) / 86400 ))
          echo "Último cambio hace $DIAS día(s)"
          if [ "$DIAS" -ge 6 ]; then echo "toca=si" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.actividad.outputs.toca == 'si'
      - name: Actividad semanal
        if: steps.actividad.outputs.toca == 'si'
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" > ultima-revision.txt
          git config user.name "sistema-escolar"
          git config user.email "sistema-escolar@users.noreply.github.com"
          git add ultima-revision.txt
          git commit -m "Actividad semanal" && git push
