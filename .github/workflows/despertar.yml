# Mantiene despierto el sistema escolar en Render (plan gratis): lo visita cada 5 minutos
# para que no "se duerma" y nadie tenga que esperar a que arranque.
name: Mantener despierto el sistema

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Visitar el sistema
        run: |
          curl -sS -m 120 -o /dev/null -w "Respuesta: %{http_code} en %{time_total} s\n" https://ie-luis-lopez-mesa.onrender.com/api/public || echo "No respondió (puede estar arrancando)"

      # GitHub pausa las tareas programadas si el repositorio pasa 60 días sin cambios:
      # una vez por semana (lunes) se actualiza un archivo para que siga activo.
      - name: Revisar si toca la actividad semanal
        id: semana
        run: |
          if [ "$(date -u +%u%H)" = "112" ] && [ "$(date -u +%M)" -lt 5 ]; then echo "toca=si" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.semana.outputs.toca == 'si'
      - name: Actividad semanal
        if: steps.semana.outputs.toca == 'si'
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" > ultima-revision.txt
          git config user.name "sistema-escolar"
          git config user.email "sistema-escolar@users.noreply.github.com"
          git add ultima-revision.txt
          git commit -m "Actividad semanal" && git push
