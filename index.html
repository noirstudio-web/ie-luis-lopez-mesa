<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aulora · Gestión escolar</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1B1F3B">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap">
  <style>
    /* Paleta Aulora: Tinta #1B1F3B · Amanecer #F4A62A · Papel #FFF7EA */
    :root { --ink: #1B1F3B; --sun: #F4A62A; --paper: #FFF7EA; --muted: #9AA0C3; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; overflow: hidden;
      font-family: "Outfit", "Segoe UI", system-ui, sans-serif; color: var(--paper); background: var(--ink); }
    body::after { content: ""; position: fixed; left: 50%; bottom: -280px; width: 820px; height: 560px; transform: translateX(-50%); border-radius: 50%;
      background: radial-gradient(closest-side, rgba(244, 166, 42, .45), rgba(244, 166, 42, .1) 55%, transparent 75%); pointer-events: none; }
    .card { position: relative; z-index: 1; width: 100%; max-width: 420px; text-align: center; }
    .icon { display: block; width: 104px; height: 104px; margin: 0 auto 18px; border-radius: 24px; box-shadow: 0 16px 40px rgba(0, 0, 0, .35); }
    .wordmark { font-weight: 800; font-size: 56px; letter-spacing: -.035em; line-height: 1; }
    .wordmark span { color: var(--sun); }
    .tagline { margin: 10px 0 30px; font-size: 12px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: var(--muted); }
    p { color: #C9CCE0; margin: 0 0 18px; line-height: 1.5; }
    .spinner { width: 34px; height: 34px; margin: 6px auto 18px; border: 3px solid rgba(255, 247, 234, .15); border-top-color: var(--sun); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn { display: inline-flex; justify-content: center; width: 100%; padding: 14px 18px; border-radius: 12px; border: 0;
      background: var(--sun); color: var(--ink); font: inherit; font-weight: 800; text-decoration: none; cursor: pointer; }
    .off { color: #FCA5A5; font-weight: 600; }
    small { display: block; color: var(--muted); margin-top: 16px; font-size: 12.5px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="favicon-192.png" alt="Aulora" width="104" height="104">
    <div class="wordmark">aul<span>o</span>ra</div>
    <div class="tagline">Gestión escolar inteligente</div>
    <section id="loading"><p>Abriendo la plataforma…</p><div class="spinner"></div></section>
    <section id="ready" hidden>
      <p>Si no se abre sola, toca el botón.</p>
      <a class="btn" id="go" href="#">Entrar a Aulora</a>
    </section>
    <section id="down" hidden>
      <p class="off">No se pudo abrir la plataforma en este momento.</p>
      <p>Revisa tu conexión a internet e intenta de nuevo.</p>
      <button class="btn" onclick="location.reload()">Intentar de nuevo</button>
    </section>
    <small id="info"></small>
  </main>
  <script>
    // La dirección de la plataforma está en direccion.json
    const show = id => ['loading', 'ready', 'down'].forEach(s => { document.getElementById(s).hidden = s !== id; });
    const withTimeout = (p, ms) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error('tiempo')), ms))]);
    // Dos fuentes de la dirección: la copia publicada (rápida) y el archivo directo en GitHub (se actualiza al instante)
    const sources = [
      async () => (await fetch('direccion.json?t=' + Date.now(), { cache: 'no-store' })).json(),
      async () => {
        const j = await (await fetch('https://api.github.com/repos/noirstudio-web/ie-luis-lopez-mesa/contents/direccion.json?t=' + Date.now(), { cache: 'no-store' })).json();
        return JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, '')))));
      }
    ];
    const reachable = url => withTimeout(fetch(url + '/api/public?t=' + Date.now(), { mode: 'no-cors', cache: 'no-store' }), 10000).then(() => true, () => false);
    const go = d => {
      const target = d.url + (location.hash || '');
      document.getElementById('go').href = target;
      show('ready');
      location.replace(target);
    };
    (async () => {
      const tried = new Set();
      for (const get of sources) {
        let d;
        try { d = await get(); } catch { continue; }
        if (!d?.url || tried.has(d.url)) continue;
        tried.add(d.url);
        // En la nube la dirección es fija: se entra directo (si estaba dormida, se despierta sola)
        if (d.nube) return go(d);
        if (await reachable(d.url)) return go(d);
      }
      show('down');
    })();
  </script>
</body>
</html>
